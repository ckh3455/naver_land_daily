name: 네이버 부동산 크롤링

on:
  schedule:
    # 매일 오전 3시 (한국 시간) = UTC 18시
    - cron: '0 18 * * *'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  crawl:
    runs-on: ubuntu-22.04  # Ubuntu 22.04로 고정 (Playwright 호환성)
    timeout-minutes: 60  # 최대 1시간
    
    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4
    
    - name: Python 3.11 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Python 의존성 설치
      run: |
        pip install -r requirements.txt
    
    - name: Playwright 브라우저 설치
      run: |
        playwright install chromium
        playwright install-deps chromium
    
    - name: 서비스 계정 키 생성
      run: |
        cat << 'EOF' > service_account.json
        ${{ secrets.SERVICE_ACCOUNT_JSON }}
        EOF
        echo "서비스 계정 파일 생성 완료"
        ls -lh service_account.json
    
    - name: 크롤링 실행
      env:
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      run: |
        python main_github.py
    
    - name: 크롤링 결과 업로드
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: crawling-results-${{ github.run_number }}
        path: |
          crawling_results.json
        retention-days: 30
    
    - name: 정리
      if: always()
      run: |
        rm -f service_account.json
