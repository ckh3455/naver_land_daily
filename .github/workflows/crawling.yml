name: Naver Property Crawler

# 워크플로 실행 조건: main 브랜치에 푸시가 발생할 때 자동 실행
on:
  push:
    branches:
      - main
  # 수동 실행 옵션 (필요한 경우)
  workflow_dispatch:

jobs:
  crawl:
    # 실행 환경 설정 (GitHub Actions의 서버)
    runs-on: ubuntu-latest
    # 타임존을 한국 시간으로 설정 (로그 시간 확인 용이)
    env:
      TZ: Asia/Seoul

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 사용하시는 Python 버전에 맞게 설정

      # 3. 의존성 설치 및 Playwright 브라우저 설치
      - name: Install dependencies and Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Playwright가 사용할 Chromium 브라우저를 설치합니다.
          playwright install chromium --with-deps

      # 4. 서비스 계정 파일 생성 (구글 시트/드라이브 접근용)
      # GitHub Secrets에 PRIVATE_KEY와 같은 내용이 설정되어 있어야 합니다.
      - name: Create service_account.json
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" > service_account.json
        # SERVICE_ACCOUNT_JSON은 GitHub Secrets에 JSON 내용을 통째로 넣어두는 것을 가정합니다.
        # 환경 변수 SPREADSHEET_ID도 Secrets에 설정되어야 main.py에서 사용 가능합니다.
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      # 5. 크롤러 스크립트 실행
      - name: Run Crawler Script
        run: python main.py

      # 6. 🚨 (핵심) 스크린샷 파일을 아티팩트로 업로드 
      - name: Upload Screenshots as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawl-screenshots-${{ github.sha }}  # 아티팩트 이름 (commit SHA 포함)
          path: '*.png' # 현재 디렉토리에 있는 모든 PNG 파일을 수집하여 업로드합니다.
          retention-days: 7 # 7일간 보관
