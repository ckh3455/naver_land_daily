name: Naver Property Scraper

# 매일 한국 시간 (KST) 오전 10시에 실행
on:
  workflow_dispatch:
  schedule:
    # 매일 01:00 UTC (한국 시간 오전 10시)
    - cron: '0 1 * * *' 

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: ⬇️ 코드 체크아웃
      uses: actions/checkout@v4

    - name: 🐍 Python 3.10 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Python 의존성 설치 (requirements.txt 사용)
      # 이 단계에서 Playwright Python 라이브러리(playwright==1.40.0)를 설치합니다.
      run: pip install -r requirements.txt

    - name: 🌐 Playwright 시스템 종속성 및 브라우저 설치 (오류 해결)
      # 1. apt 업데이트 및 Chromium 시스템 종속성 설치 (에러의 원인인 'libasound2' 관련 문제 해결)
      # 2. 'python -m playwright install chromium' 명령어는 pip 설치 후 실행되어야 합니다.
      run: |
        sudo apt-get update
        # Playwright가 요구하는 핵심 시스템 라이브러리들을 설치합니다.
        sudo apt-get install -y libnss3 libatk-bridge2.0 libxkbcommon-0
        # Playwright 브라우저 파일 자체를 설치합니다.
        python -m playwright install chromium

    - name: 🔑 Google 서비스 계정 파일 생성
      # Secret에 저장된 키를 파일로 만들어줍니다.
      env:
        GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      run: echo "$GCP_SERVICE_ACCOUNT_KEY" > service_account.json

    - name: 🚀 네이버 부동산 크롤링 실행 및 구글 시트 기록
      # main.py 스크립트를 실행합니다.
      env:
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      run: python main.py
