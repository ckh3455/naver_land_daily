name: 네이버 부동산 크롤링 및 데이터 정리 (부팅 후 자동 실행)

on:
  schedule:
    # 한국 시간 오전 3시에 작업을 대기열에 등록합니다.
    # PC가 꺼져 있으면 최대 24시간 대기하며, 부팅 후 Runner가 연결되는 즉시 실행됩니다.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naver-land-daily
  cancel-in-progress: false

jobs:
  crawl-and-process:
    runs-on: [self-hosted, windows]
    timeout-minutes: 60

    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      MIN_SUCCESSFUL_COMPLEXES: "23"
      MIN_TOTAL_PROPERTIES: "100"
      NAVER_SHARED_DRIVE_ID: "0APa-MWwUseXzUk9PVA"
      NAVER_RAW_FOLDER_ID: "1VaNfmXUvStoyEy3ky11GwJ2Y8U5v97eb"
      NAVER_OFFICIAL_FOLDER_ID: "1jICqHFCLXwE0mFI7u4KV89IslIhxtBkA"
      NAVER_CHANGE_FOLDER_ID: "1n--RaXCyjz8RAovf9uwtKabUIKj50wZl"
      NAVER_LOG_FOLDER_ID: "17lQp0aXVfmAuqM14GmkgBPvtfjA_t0UN"
      SOURCE_LISTING_SPREADSHEET_ID: "1QP56lm5kPBdsUhrgcgY2U-JdmukXIkKCSxefd1QExKE"

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 확인
        shell: powershell
        run: |
          $pythonCandidates = @(
            "C:\Python311\python.exe",
            "C:\ProgramData\anaconda3\python.exe"
          )
          $python = $pythonCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (!$python) {
            Write-Error "지원되는 Python을 찾을 수 없습니다."
            exit 1
          }

          if ($python -like "C:\ProgramData\anaconda3\*") {
            $condaRoot = Split-Path $python
            $condaPaths = @(
              $condaRoot,
              "$condaRoot\Scripts",
              "$condaRoot\Library\bin"
            )
            $env:PATH = (($condaPaths -join ";") + ";" + $env:PATH)
            $condaPaths | ForEach-Object {
              $_ | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
            "CONDA_DLL_SEARCH_MODIFICATION_ENABLE=1" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          "PYTHON_EXE=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Python executable: $python"
          & $python --version
          & $python -c "import ssl; print('SSL:', ssl.OPENSSL_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 필요한 Python 패키지만 설치
        shell: powershell
        run: |
          & $env:PYTHON_EXE -c "import playwright, gspread, googleapiclient"
          if ($LASTEXITCODE -ne 0) {
            & $env:PYTHON_EXE -m pip install -r requirements.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "필수 패키지가 이미 설치되어 있어 설치를 생략합니다."
          }

      - name: 보관 코드 사전 검증
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m py_compile main_github.py drive_archive.py main_with_archive.py test_drive_archive.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_EXE -c "from test_drive_archive import test_price_parsing_and_classification, test_filter_and_changes, test_display_group_trends_do_not_merge_exact_and_middle_floors, test_disappeared_display_group_is_recorded_once_with_zero_ads, test_first_baseline_and_unchanged_groups_are_not_recorded, test_transaction_history_is_reference_not_forced_identity; test_price_parsing_and_classification(); test_filter_and_changes(); test_display_group_trends_do_not_merge_exact_and_middle_floors(); test_disappeared_display_group_is_recorded_once_with_zero_ads(); test_first_baseline_and_unchanged_groups_are_not_recorded(); test_transaction_history_is_reference_not_forced_identity(); print('Drive archive, trend, and transaction tests passed')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Chromium 확인
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 서비스 계정 키 생성
        shell: powershell
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          $json = $env:SERVICE_ACCOUNT_JSON
          if ([string]::IsNullOrWhiteSpace($json)) {
            Write-Error "SERVICE_ACCOUNT_JSON secret이 비어있습니다."
            exit 1
          }
          $json = $json -replace "^\uFEFF", ""
          $json = $json -replace "\uFEFF", ""
          [System.IO.File]::WriteAllText(
            "service_account.json",
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: 크롤링·데이터 정리·공유 드라이브 보관
        shell: powershell
        run: |
          & $env:PYTHON_EXE main_with_archive.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 실행 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawling-results-${{ github.run_number }}
          path: |
            crawling_results.json
            drive_archive_summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: 서비스 계정 키 삭제
        if: always()
        shell: powershell
        run: Remove-Item -Force service_account.json -ErrorAction SilentlyContinue
