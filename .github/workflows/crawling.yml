name: 네이버 부동산 크롤링 및 데이터 정리

on:
  pull_request:
    branches: [main]
    paths:
      - "main_github.py"
      - "naver_access_probe.py"
      - "requirements.txt"
      - ".github/workflows/crawling.yml"
      - ".github/workflows/naver-attempt.yml"
  schedule:
    # 매일 오전 3시 (한국 시간) = UTC 18시
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naver-land-daily
  cancel-in-progress: false

jobs:
  attempt1:
    name: Attempt 1
    uses: ./.github/workflows/naver-attempt.yml
    with:
      attempt_name: attempt1
    secrets: inherit

  attempt2:
    name: Attempt 2
    needs: attempt1
    if: always() && needs.attempt1.outputs.success != '1'
    uses: ./.github/workflows/naver-attempt.yml
    with:
      attempt_name: attempt2
    secrets: inherit

  attempt3:
    name: Attempt 3
    needs: [attempt1, attempt2]
    if: always() && needs.attempt1.outputs.success != '1' && needs.attempt2.outputs.success != '1'
    uses: ./.github/workflows/naver-attempt.yml
    with:
      attempt_name: attempt3
    secrets: inherit

  final-status:
    name: 최종 결과
    if: always()
    needs: [attempt1, attempt2, attempt3]
    runs-on: ubuntu-latest
    steps:
      - name: 성공 여부 확인
        shell: bash
        run: |
          if [[ "${{ needs.attempt1.outputs.success }}" == "1" ||
                "${{ needs.attempt2.outputs.success }}" == "1" ||
                "${{ needs.attempt3.outputs.success }}" == "1" ]]; then
            echo "네이버 부동산 크롤링 성공"
            exit 0
          fi
          echo "3개의 GitHub Runner에서 모두 실패했습니다."
          exit 1
