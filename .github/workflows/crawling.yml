name: 네이버 부동산 크롤링 및 데이터 정리 (Windows Self-hosted)

on:
  schedule:
    # 매일 오전 3시 (한국 시간) = UTC 18시
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  crawl-and-process:
    runs-on: [self-hosted, windows]
    timeout-minutes: 60

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 확인 (시스템 Python 사용)
        shell: pwsh
        run: |
          Write-Host "=== Python 버전/경로 확인 ==="
          python --version
          where.exe python
          python -c "import sys; print(sys.executable)"

      - name: Python 의존성 설치
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip --version
          pip install -r requirements.txt

      - name: Playwright 브라우저 설치 (Windows)
        shell: pwsh
        run: |
          python -m playwright install chromium

      - name: 파일 목록 확인 (디버깅)
        shell: pwsh
        run: |
          Write-Host "=== 현재 디렉토리 ==="
          Get-Location
          Write-Host ""
          Write-Host "=== 전체 파일 목록 ==="
          Get-ChildItem -Force
          Write-Host ""
          Write-Host "=== Python 파일 목록(상위 20개) ==="
          Get-ChildItem -Recurse -Filter *.py -File | Select-Object -First 20 | ForEach-Object { $_.FullName }

      - name: 서비스 계정 키 생성
        shell: pwsh
        run: |
          @'
          ${{ secrets.SERVICE_ACCOUNT_JSON }}
          '@ | Out-File -FilePath service_account.json -Encoding utf8 -Force

          Write-Host "서비스 계정 파일 생성 완료"
          Get-Item service_account.json | Format-List

      - name: 크롤링 및 데이터 정리 실행
        shell: pwsh
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          Write-Host "=== 크롤러 파일 찾기 ==="

          if (Test-Path "main_github.py") {
            Write-Host "✅ main_github.py 발견"
            python main_github.py

          } elseif (Test-Path "crawler_with_processor.py") {
            Write-Host "✅ crawler_with_processor.py 발견"
            python crawler_with_processor.py

          } elseif (Test-Path "naver_crawler_playwright.py") {
            Write-Host "⚠️  main_github.py를 찾을 수 없습니다."
            Write-Host "⚠️  naver_crawler_playwright.py를 사용합니다."
            python naver_crawler_playwright.py

          } else {
            Write-Error "❌ 오류: 크롤러 파일을 찾을 수 없습니다!"
            Write-Host ""
            Write-Host "현재 디렉토리의 Python 파일:"
            Get-ChildItem -Filter *.py -File -ErrorAction SilentlyContinue | Format-Table -Auto
            Write-Host ""
            Write-Host "하위 디렉토리의 Python 파일:"
            Get-ChildItem -Recurse -Filter *.py -File | Select-Object -First 20 | ForEach-Object { $_.FullName }
            exit 1
          }

      - name: 크롤링 결과 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawling-results-${{ github.run_number }}
          path: |
            crawling_results.json
          retention-days: 30

      - name: 정리
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force service_account.json -ErrorAction SilentlyContinue
