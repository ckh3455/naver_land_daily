name: 네이버 부동산 크롤링 및 데이터 정리

on:
  schedule:
    # 매일 오전 3시 (한국 시간) = UTC 18시
    - cron: '0 18 * * *'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  crawl-and-process:
    runs-on: ubuntu-22.04  # Ubuntu 22.04로 고정 (Playwright 호환성)
    timeout-minutes: 60  # 최대 1시간
    
    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4
    
    - name: Python 3.11 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: 시스템 의존성 설치
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnss3 \
          libatk-bridge2.0-0 \
          libdrm2 \
          libxkbcommon0 \
          libxcomposite1 \
          libxdamage1 \
          libxfixes3 \
          libxrandr2 \
          libgbm1 \
          libasound2
    
    - name: Python 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Playwright 브라우저 설치
      run: |
        playwright install chromium
        playwright install-deps chromium
    
    - name: 파일 목록 확인 (디버깅)
      run: |
        echo "=== 현재 디렉토리 ==="
        pwd
        echo ""
        echo "=== 전체 파일 목록 ==="
        ls -la
        echo ""
        echo "=== Python 파일 목록 ==="
        find . -name "*.py" -type f | head -20 || echo "Python 파일 없음"
        echo ""
        echo "=== 루트 디렉토리 Python 파일 ==="
        ls -la *.py 2>/dev/null || echo "루트에 Python 파일 없음"
    
    - name: 서비스 계정 키 생성
      run: |
        cat << 'EOF' > service_account.json
        ${{ secrets.SERVICE_ACCOUNT_JSON }}
        EOF
        echo "서비스 계정 파일 생성 완료"
        ls -lh service_account.json
    
    - name: 크롤링 및 데이터 정리 실행
      env:
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      run: |
        echo "=== 크롤러 파일 찾기 ==="
        if [ -f "main_github.py" ]; then
          echo "✅ main_github.py 발견"
          python main_github.py
        elif [ -f "crawler_with_processor.py" ]; then
          echo "✅ crawler_with_processor.py 발견"
          python crawler_with_processor.py
        elif [ -f "naver_crawler_playwright.py" ]; then
          echo "⚠️  main_github.py를 찾을 수 없습니다."
          echo "⚠️  naver_crawler_playwright.py를 사용합니다."
          python naver_crawler_playwright.py
        else
          echo "❌ 오류: 크롤러 파일을 찾을 수 없습니다!"
          echo ""
          echo "현재 디렉토리의 Python 파일:"
          ls -la *.py 2>/dev/null || echo "  (없음)"
          echo ""
          echo "하위 디렉토리의 Python 파일:"
          find . -name "*.py" -type f | head -10
          echo ""
          echo "💡 해결 방법:"
          echo "   1. GitHub 저장소에 main_github.py 파일을 업로드하세요"
          echo "   2. 또는 저장소 루트에 파일이 있는지 확인하세요"
          exit 1
        fi
    
    - name: 크롤링 결과 업로드
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: crawling-results-${{ github.run_number }}
        path: |
          crawling_results.json
        retention-days: 30
    
    - name: 정리
      if: always()
      run: |
        rm -f service_account.json

