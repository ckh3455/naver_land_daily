name: Naver Property Scraper

# 매일 한국 시간 (KST) 오전 10시에 실행
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' 

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: ⬇️ 코드 체크아웃
      uses: actions/checkout@v4

    - name: 🐍 Python 3.10 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Python 의존성 설치
      run: pip install -r requirements.txt

    - name: 🌐 Playwright 시스템 종속성 및 브라우저 설치 (오류 우회 해결)
      # libasound2 문제 및 기타 종속성 문제를 우회하고 브라우저를 설치합니다.
      run: |
        echo "Updating apt cache and installing core dependencies..."
        sudo apt-get update
        
        # APT 설치 실패 시에도 다음 명령어를 진행하도록 '|| true' 추가
        # libasound2 대신 libasound2t64 설치 시도 및 기타 필수 패키지 설치
        sudo apt-get install -y --no-install-recommends \
          libnss3 \
          libatk-bridge2.0-0 \
          libxkbcommon0 \
          libgtk-3-0 \
          libgbm1 \
          libasound2t64 \
          libxdamage1 \
          libpangocairo-1.0-0 \
          libu2f-udev \
          libvulkan1 || true
        
        echo "Installing Playwright Chromium browser..."
        # Playwright 브라우저 설치 (시스템 종속성이 부족해도 자체 설치 시도)
        python -m playwright install chromium

    - name: 🔑 Google 서비스 계정 파일 생성
      env:
        GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      run: echo "$GCP_SERVICE_ACCOUNT_KEY" > service_account.json

    - name: 🚀 네이버 부동산 크롤링 실행 및 구글 시트 기록
      env:
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      run: python main.py
