name: Naver Property Crawler

# 워크플로 실행 조건: main 브랜치에 푸시가 발생할 때 자동 실행
on:
  push:
    branches:
      - main
  # 수동 실행 옵션 (필요한 경우)
  workflow_dispatch:

jobs:
  crawl:
    # 실행 환경 설정 (GitHub Actions의 서버)
    runs-on: ubuntu-latest
    # 타임존을 한국 시간으로 설정 (로그 시간 확인 용이)
    env:
      TZ: Asia/Seoul

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 사용하시는 Python 버전에 맞게 설정

      # 3. 🚨 [최종 수정] 필수 시스템 종속성 수동 설치 (목록 최소화)
      - name: Install System Dependencies
        run: |
          # 패키지 목록 업데이트
          sudo apt-get update
          
          # 최소한의 필수 라이브러리만 설치하여 오류 발생 가능성을 줄입니다.
          sudo apt-get install -y libnss3 libgbm1 libxkbcommon0 libgtk-3-0 libnotify-dev

      # 4. Python 의존성 설치
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Playwright 브라우저 파일 설치
      - name: Install Playwright Browsers
        run: |
          # 시스템 종속성 확인 없이 브라우저 파일만 다운로드합니다.
          playwright install chromium

      # 6. 서비스 계정 파일 생성 (구글 시트/드라이브 접근용)
      - name: Create service_account.json
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" > service_account.json
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      # 7. 크롤러 스크립트 실행
      - name: Run Crawler Script
        run: python main.py

      # 8. 스크린샷 파일을 아티팩트로 업로드 
      - name: Upload Screenshots as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawl-screenshots-${{ github.sha }}  # 아티팩트 이름
          path: '*.png' # 현재 디렉토리에 있는 모든 PNG 파일을 수집하여 업로드합니다.
          retention-days: 7 # 7일간 보관
