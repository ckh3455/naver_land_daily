name: Naver Complex Crawler

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 20 * * *' 
  workflow_dispatch:

jobs:
  run_crawler:
    # 🚨 수정: 안정적인 실행을 위해 ubuntu-22.04로 고정
    runs-on: ubuntu-22.04 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          
      # 🚨 핵심 수정: 시스템 종속성 설치 (IPv4 강제 + 패키지명 수정)
      - name: Install System Dependencies with IPv4
        # 🚨 env 블록으로 apt-get에 IPv4 강제 적용
        env:
          APT_LISTCHANGES_FRONTEND: none
          # apt-get이 IPv4로 연결을 시도하도록 강제
          ACQUIRE_FORCE_IPV4: true 
        run: |
          sudo apt-get update
          # libasound6 대신 일반적으로 사용되는 libasound2를 설치
          sudo apt-get install -y libnss3 libgbm1 libasound2 libdbus-1-3

      # 🚨 핵심 수정: Playwright Browsers 설치 (IPv4 강제)
      - name: Install Playwright Browsers 🚀
        env:
          # Node.js (Playwright 내부)가 DNS 쿼리 시 IPv4를 우선하도록 강제
          NODE_OPTIONS: --dns-result-order=ipv4first 
          PLAYWRIGHT_DOWNLOAD_HOST: playwright.azureedge.net
        run: |
          python3 -m playwright install chromium

      # ... (나머지 Run Crawler Script 등은 그대로 유지)
      - name: Run Crawler Script
        run: |
          python3 main.py
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
