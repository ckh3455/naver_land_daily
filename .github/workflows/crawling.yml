name: Naver Property Crawler

# 워크플로 실행 조건: main 브랜치에 푸시가 발생할 때 자동 실행
on:
  push:
    branches:
      - main
  # 수동 실행 옵션 (필요한 경우)
  workflow_dispatch:

jobs:
  crawl:
    # 실행 환경 설정 (GitHub Actions의 서버)
    runs-on: ubuntu-latest
    # 타임존을 한국 시간으로 설정 (로그 시간 확인 용이)
    env:
      TZ: Asia/Seoul

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 사용하시는 Python 버전에 맞게 설정

      # 3. 의존성 설치 및 Playwright 브라우저 설치 (🚨 libasound2 오류 해결 로직)
      - name: Install dependencies and Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
          # 시스템 패키지 목록을 최신화하고, Playwright 실행에 필요한 핵심 라이브러리(libgbm1)를 수동으로 설치
          sudo apt-get update
          sudo apt-get install -y libgbm1
          
          # --force 플래그를 사용하여 종속성 누락 오류(libasound2)를 무시하고 Chromium을 설치합니다.
          playwright install chromium --with-deps --force

      # 4. 서비스 계정 파일 생성 (구글 시트/드라이브 접근용)
      - name: Create service_account.json
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" > service_account.json
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      # 5. 크롤러 스크립트 실행
      - name: Run Crawler Script
        run: python main.py

      # 6. 스크린샷 파일을 아티팩트로 업로드 
      - name: Upload Screenshots as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawl-screenshots-${{ github.sha }}  # 아티팩트 이름
          path: '*.png' # 현재 디렉토리에 있는 모든 PNG 파일을 수집하여 업로드합니다.
          retention-days: 7 # 7일간 보관
