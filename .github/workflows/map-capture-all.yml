name: 압구정 130개동 네이버 지도 고배율 전수캡처

on:
  push:
    paths:
      - 'map_capture_all.py'
      - '.github/workflows/map-capture-all.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naver-map-capture-all
  cancel-in-progress: false

jobs:
  capture-batches:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch:
          - { name: '001-010', start: 1, end: 10 }
          - { name: '011-020', start: 11, end: 20 }
          - { name: '021-030', start: 21, end: 30 }
          - { name: '031-040', start: 31, end: 40 }
          - { name: '041-050', start: 41, end: 50 }
          - { name: '051-060', start: 51, end: 60 }
          - { name: '061-070', start: 61, end: 70 }
          - { name: '071-080', start: 71, end: 80 }
          - { name: '081-090', start: 81, end: 90 }
          - { name: '091-100', start: 91, end: 100 }
          - { name: '101-110', start: 101, end: 110 }
          - { name: '111-120', start: 111, end: 120 }
          - { name: '121-130', start: 121, end: 130 }

    name: capture-${{ matrix.batch.name }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      START_INDEX: ${{ matrix.batch.start }}
      END_INDEX: ${{ matrix.batch.end }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 확인
        shell: powershell
        run: |
          $pythonCandidates = @(
            'C:\Python311\python.exe',
            'C:\ProgramData\anaconda3\python.exe'
          )
          $python = $pythonCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$python) { Write-Error '지원되는 Python을 찾을 수 없습니다.'; exit 1 }
          "PYTHON_EXE=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $python --version

      - name: Playwright/Chromium 확인
        shell: powershell
        run: |
          & $env:PYTHON_EXE -c "import playwright"
          if ($LASTEXITCODE -ne 0) {
            & $env:PYTHON_EXE -m pip install playwright
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $env:PYTHON_EXE -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 고배율 캡처 ${{ matrix.batch.name }}
        shell: powershell
        run: |
          Write-Host "Capture range: $env:START_INDEX ~ $env:END_INDEX"
          & $env:PYTHON_EXE map_capture_all.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 묶음 캡처 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apgujeong-naver-highzoom-${{ matrix.batch.name }}-${{ github.run_number }}
          path: map_capture_all_artifacts/
          if-no-files-found: warn
          retention-days: 14
