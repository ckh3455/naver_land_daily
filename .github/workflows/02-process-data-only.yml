name: 부동산 데이터 정리 (정리만)

on:
  workflow_dispatch:  # 필요할 때만 수동 실행

jobs:
  process-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4
    
    - name: Python 3.11 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Python 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
    
    - name: 서비스 계정 키 생성
      run: |
        cat << 'EOF' > service_account.json
        ${{ secrets.SERVICE_ACCOUNT_JSON }}
        EOF
        echo "서비스 계정 파일 생성 완료"
    
    - name: 데이터 정리 실행
      env:
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      run: |
        echo "=== 데이터 정리 스크립트 실행 ==="
        if [ -f "test_data_processing.py" ]; then
          echo "✅ test_data_processing.py 발견"
          python test_data_processing.py
        elif [ -f "process_data_only.py" ]; then
          echo "✅ process_data_only.py 발견"
          python process_data_only.py
        else
          echo "❌ 오류: 데이터 정리 스크립트를 찾을 수 없습니다!"
          exit 1
        fi
    
    - name: 정리
      if: always()
      run: |
        rm -f service_account.json
