name: 네이버 지도 고배율 캡처 파일럿

on:
  push:
    paths:
      - 'map_capture_pilot.py'
      - '.github/workflows/map-capture-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naver-map-capture-pilot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: [self-hosted, windows]
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 확인
        shell: powershell
        run: |
          $pythonCandidates = @(
            'C:\Python311\python.exe',
            'C:\ProgramData\anaconda3\python.exe'
          )
          $python = $pythonCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$python) { Write-Error '지원되는 Python을 찾을 수 없습니다.'; exit 1 }
          "PYTHON_EXE=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $python --version

      - name: Playwright/Chromium 확인
        shell: powershell
        run: |
          & $env:PYTHON_EXE -c "import playwright"
          if ($LASTEXITCODE -ne 0) {
            & $env:PYTHON_EXE -m pip install playwright
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $env:PYTHON_EXE -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 현대6·7차 미처리동 고배율 캡처
        shell: powershell
        run: |
          & $env:PYTHON_EXE map_capture_pilot.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 캡처 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-map-capture-pilot-${{ github.run_number }}
          path: map_capture_pilot_artifacts/
          if-no-files-found: warn
          retention-days: 14
