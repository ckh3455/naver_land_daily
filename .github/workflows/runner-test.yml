name: 집 Windows Runner 연결 테스트

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-diagnostic:
    runs-on: [self-hosted, windows, home]
    timeout-minutes: 5

    steps:
      - name: Runner 정보 확인
        shell: powershell
        run: |
          Write-Host "Runner Name: $env:RUNNER_NAME"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner Arch: $env:RUNNER_ARCH"
          Write-Host "Computer: $env:COMPUTERNAME"
          Get-Service -Name "actions.runner.*" -ErrorAction SilentlyContinue |
            Select-Object Status, Name, DisplayName, StartType |
            Format-Table -AutoSize

      - name: Python 확인
        shell: powershell
        run: |
          if (!(Test-Path "C:\Python311\python.exe")) {
            Write-Error "C:\Python311\python.exe를 찾을 수 없습니다."
            exit 1
          }
          & "C:\Python311\python.exe" --version
          & "C:\Python311\python.exe" -c "import playwright, gspread, googleapiclient; print('필수 패키지 확인 완료')"

      - name: 테스트 완료
        shell: powershell
        run: Write-Host "HOME Windows Runner 테스트 성공"
