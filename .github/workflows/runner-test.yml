name: 집 Windows Runner 연결 테스트

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-diagnostic:
    runs-on: [self-hosted, windows, home]
    timeout-minutes: 5

    steps:
      - name: Runner 정보 확인
        shell: powershell
        run: |
          Write-Host "Runner Name: $env:RUNNER_NAME"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner Arch: $env:RUNNER_ARCH"
          Write-Host "Computer: $env:COMPUTERNAME"
          Get-Service -Name "actions.runner.*" -ErrorAction SilentlyContinue |
            Select-Object Status, Name, DisplayName, StartType |
            Format-Table -AutoSize

      - name: Python 확인
        shell: powershell
        run: |
          $pythonCandidates = @(
            "C:\Python311\python.exe",
            "C:\ProgramData\anaconda3\python.exe"
          )
          $python = $pythonCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (!$python) {
            Write-Error "지원되는 Python을 찾을 수 없습니다."
            exit 1
          }
          Write-Host "Python executable: $python"
          & $python --version
          & $python -c "import playwright, gspread, googleapiclient; print('required packages OK')"

      - name: 테스트 완료
        shell: powershell
        run: Write-Host "HOME Windows Runner 테스트 성공"
