name: 집 Windows Runner 연결 테스트

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-diagnostic:
    runs-on: [self-hosted, windows, home]
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Runner 정보 확인
        shell: powershell
        run: |
          Write-Host "Runner Name: $env:RUNNER_NAME"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner Arch: $env:RUNNER_ARCH"
          Write-Host "Computer: $env:COMPUTERNAME"
          Get-Service -Name "actions.runner.*" -ErrorAction SilentlyContinue |
            Select-Object Status, Name, DisplayName, StartType |
            Format-Table -AutoSize

      - name: Python 확인
        shell: powershell
        run: |
          $pythonCandidates = @(
            "C:\Python311\python.exe",
            "C:\ProgramData\anaconda3\python.exe"
          )
          $python = $pythonCandidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (!$python) {
            Write-Error "지원되는 Python을 찾을 수 없습니다."
            exit 1
          }

          if ($python -like "C:\ProgramData\anaconda3\*") {
            $condaRoot = Split-Path $python
            $condaPaths = @(
              $condaRoot,
              "$condaRoot\Scripts",
              "$condaRoot\Library\bin"
            )
            $env:PATH = (($condaPaths -join ";") + ";" + $env:PATH)
            $condaPaths | ForEach-Object {
              $_ | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
            "CONDA_DLL_SEARCH_MODIFICATION_ENABLE=1" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          "PYTHON_EXE=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Python executable: $python"
          & $python --version
          & $python -c "import ssl; print('SSL:', ssl.OPENSSL_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 필수 패키지 설치 및 확인
        shell: powershell
        run: |
          & $env:PYTHON_EXE -c "import playwright, gspread, googleapiclient"
          if ($LASTEXITCODE -ne 0) {
            & $env:PYTHON_EXE -m pip install -r requirements.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $env:PYTHON_EXE -c "import playwright, gspread, googleapiclient; print('required packages OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Chromium 설치 확인
        shell: powershell
        run: |
          & $env:PYTHON_EXE -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 테스트 완료
        shell: powershell
        run: Write-Host "HOME Windows Runner 테스트 성공"
